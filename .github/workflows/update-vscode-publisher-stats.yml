name: Update VS Code Publisher Stats

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: kpab/vscode-publisher-stats@v1
        with:
          publisher: kpab
          badge-path: assets/vscode-marketplace.json

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/vscode-marketplace.json
          git diff --cached --quiet || git commit -m "chore: update VS Code Marketplace stats"
          git push
